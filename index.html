<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="ad.size" content="width=970,height=250">
<title>Ford Explorer 970x250 — Dinamik Kreatif (Master)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{width:970px;height:250px;overflow:hidden;background:#fff;
  font:400 13px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.b{position:relative;width:970px;height:250px;overflow:hidden;cursor:pointer;background:#00095B}

/* ===================== SOL RAY (menü) ===================== */
.rail{position:absolute;left:0;top:0;width:200px;height:250px;z-index:20;
  background:linear-gradient(165deg,#0A1642 0%,var(--ford-lacivert,#00095B) 55%,#040B33 100%);
  padding:12px 13px 11px;display:flex;flex-direction:column;justify-content:space-between}
.rail::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.16),rgba(255,255,255,.02))}
.lg{flex:none;width:80px;height:29px;display:block}
nav{display:flex;flex-direction:column;gap:2.5px}
nav button{position:relative;height:22px;border:0;border-radius:3px;cursor:pointer;overflow:hidden;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.66);text-align:left;
  font:600 9.5px/22px -apple-system,'Segoe UI',Arial;letter-spacing:.35px;
  padding:0 8px 0 9px;transition:background .22s,color .22s;display:block;width:100%}
nav button:hover{background:rgba(255,255,255,.13);color:#fff}
nav button.on{background:var(--ford-mavi,#066FEF);color:#fff;box-shadow:0 2px 8px rgba(6,111,239,.45)}
nav button em{position:absolute;right:8px;top:0;font-style:normal;opacity:0;transition:opacity .2s,transform .2s;transform:translateX(-3px)}
nav button.on em{opacity:1;transform:translateX(0)}
nav button i{position:absolute;left:0;bottom:0;height:2px;width:0;background:rgba(255,255,255,.85);border-radius:1px}
nav button.on i{width:var(--pr,0%)}
.cta{flex:none;height:27px;border:0;border-radius:3px;cursor:pointer;background:#fff;color:var(--ford-lacivert,#00095B);
  font:700 10.5px/27px -apple-system,'Segoe UI',Arial;letter-spacing:.5px;transition:background .2s,color .2s}
.cta:hover{background:var(--ford-mavi,#066FEF);color:#fff}

/* ===================== SAHNE ===================== */
/* Zemin, render'ların arka planı ile birebir aynı tonda biter (#C2D3E3),
   böylece metin alanı ile araç alanı arasında görünür bir dikiş oluşmaz. */
.stage{position:absolute;left:200px;top:0;width:770px;height:250px;overflow:hidden;
  background:linear-gradient(90deg,#E6EEF6 0%,#D6E2EE 17%,#C2D3E3 32.5%,#C2D3E3 100%)}
.pan{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(7px);
  transition:opacity .42s ease,transform .42s ease,visibility 0s .42s}
.pan.on{opacity:1;visibility:visible;transform:none;transition:opacity .42s ease,transform .42s ease}

/* metin bloğu (sahnenin solu) */
.cap{position:absolute;left:0;top:0;width:250px;height:100%;z-index:8;padding:26px 16px 22px 24px;
  display:flex;flex-direction:column;justify-content:center;pointer-events:none;color:#101820}
.k{font-size:8.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--ford-mavi,#066FEF);margin-bottom:7px}
h1{font-size:21px;font-weight:600;line-height:1.12;letter-spacing:-.45px;color:var(--ford-lacivert,#00095B)}
h1 b{font-weight:800}
.d{font-size:10px;line-height:1.5;color:#4A5566;margin-top:8px}
/* araç viewport'u (sahnenin sağı) */
.vp{position:absolute;right:0;top:0;width:520px;height:250px;z-index:4}
.hint{position:absolute;right:14px;bottom:11px;z-index:9;font-size:9px;font-weight:600;letter-spacing:.4px;
  color:rgba(16,24,32,.5);pointer-events:none;transition:opacity .4s}
.hint.h{opacity:0}

/* ---- 0 · 360° ---- */
#v0{cursor:ew-resize;overflow:hidden}
#w0{position:absolute;left:0;top:0;width:600%;height:100%;
  background:url(spin.jpg) 0 0/100% 100% no-repeat;will-change:transform}
.dots{position:absolute;left:0;right:0;bottom:12px;z-index:7;display:flex;gap:5px;justify-content:center}
.dots s{width:15px;height:2.5px;border-radius:2px;background:rgba(16,24,32,.28);text-decoration:none;transition:background .2s}
.dots s.on{background:var(--ford-mavi,#066FEF)}

/* ---- 1 · Renk ---- */
#pbg1{position:absolute;inset:0;z-index:0;transition:none}
#v1{cursor:crosshair}
.car1{position:absolute;inset:0;background:url(colors.png) 0 0/400% 100% no-repeat}
#c1b{opacity:0}
.sw{position:absolute;left:24px;bottom:26px;z-index:9;display:flex;gap:7px;pointer-events:auto}
.sw b{width:17px;height:17px;border-radius:50%;cursor:pointer;display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);transition:transform .18s,box-shadow .18s}
.sw b:hover{transform:scale(1.12)}
.sw b.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 0 0 2px #fff,0 0 0 3.5px var(--ford-mavi,#066FEF)}
.nm{position:absolute;left:24px;bottom:50px;z-index:9;font-size:11px;font-weight:700;color:var(--ford-lacivert,#00095B)}

/* ---- 2 · Menzil ---- */
#v2{cursor:ew-resize}
#car2{position:absolute;left:-20px;top:0;width:520px;height:250px;
  background:url(colors.png) -1560px 0/2080px 250px no-repeat;
  transform:translateX(0);will-change:transform}
.road{position:absolute;left:26px;right:26px;bottom:34px;height:3px;background:rgba(16,24,32,.13);border-radius:2px;z-index:6}
.road i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--ford-mavi,#066FEF),#7FB6FF);box-shadow:0 0 9px rgba(6,111,239,.4)}
.pin{position:absolute;bottom:34px;z-index:7;transform:translate(-50%,50%);width:8px;height:8px;border-radius:50%;
  background:#DDE7F1;box-shadow:inset 0 0 0 1.5px rgba(16,24,32,.28);transition:background .2s,box-shadow .2s}
.pin.on{background:var(--ford-mavi,#066FEF);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 2px rgba(6,111,239,.3)}
.pin span{position:absolute;top:11px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:7.5px;font-weight:700;letter-spacing:.7px;color:rgba(16,24,32,.45)}
.pin.on span{color:var(--ford-lacivert,#00095B)}
.big{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--ford-lacivert,#00095B);margin-top:2px}
.big small{font-size:13px;font-weight:700;margin-left:3px}
.chg{display:inline-flex;align-items:center;gap:5px;margin-top:9px;align-self:flex-start;
  background:rgba(6,111,239,.1);border:1px solid rgba(6,111,239,.28);border-radius:13px;padding:4px 11px}
.chg b{font-size:11.5px;font-weight:800;color:var(--ford-lacivert,#00095B)}
.chg span{font-size:8px;font-weight:700;letter-spacing:.7px;color:#5B6B80;text-transform:uppercase}
.bat{position:absolute;right:22px;top:22px;z-index:7;display:flex;align-items:center;gap:7px}
.bat .cell{width:56px;height:20px;border-radius:3px;position:relative;padding:2px;
  box-shadow:inset 0 0 0 1.5px rgba(16,24,32,.35)}
.bat .cell::after{content:'';position:absolute;right:-4.5px;top:5.5px;width:3px;height:8px;
  background:rgba(16,24,32,.35);border-radius:0 2px 2px 0}
.bat .fill{height:100%;width:10%;border-radius:1.5px;background:linear-gradient(90deg,#3E8BF5,#8FC8FF)}
.bat .pc{font-size:12px;font-weight:800;color:var(--ford-lacivert,#00095B)}

/* ---- 3 · Teknoloji ---- */
#v3{background:url(spin.jpg) -2600px 0/3120px 250px no-repeat}
.hs{position:absolute;z-index:8;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;border-radius:50%;
  border:0;padding:0;cursor:pointer;background:var(--ford-mavi,#066FEF);
  box-shadow:0 0 0 2px #fff,0 3px 9px rgba(6,111,239,.45)}
.hs::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--ford-mavi,#066FEF);
  animation:pl 2.2s ease-out infinite;opacity:0}
.hs.on{background:var(--ford-lacivert,#00095B);transform:scale(1.12)}
.hs.on::after{animation:none}
@keyframes pl{0%{transform:scale(.8);opacity:.85}100%{transform:scale(2.3);opacity:0}}
.hs u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font:800 9px/1 Arial;color:#fff;text-decoration:none}
.ht{font-size:12.5px;font-weight:800;color:var(--ford-lacivert,#00095B);margin-top:9px;min-height:16px}
.hd{font-size:9.5px;line-height:1.5;color:#4A5566;margin-top:3px;min-height:28px}

/* ---- 4 · Röntgen ---- */
#v4{cursor:ew-resize;overflow:hidden;--c:50%}
#x4a,#x4b{position:absolute;inset:0;background:url(xray.jpg) 0 0/520px 500px no-repeat}
#x4b{background-position:0 -250px}
#x4a{clip-path:inset(0 0 0 var(--c));z-index:3}
.ln{position:absolute;top:0;bottom:0;left:var(--c);width:1.5px;background:var(--ford-mavi,#066FEF);z-index:5;pointer-events:none}
.gr{position:absolute;top:50%;left:var(--c);transform:translate(-50%,-50%);z-index:6;
  width:32px;height:32px;border-radius:50%;background:var(--ford-mavi,#066FEF);color:#fff;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  box-shadow:0 3px 12px rgba(6,111,239,.4);pointer-events:none}
.tg{position:absolute;bottom:13px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 16px;z-index:7;pointer-events:none}
.tg span{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  background:rgba(16,24,32,.6);color:#fff;padding:5px 10px;border-radius:11px}

/* ---- 5 · Performans ---- */
#v5{display:flex;align-items:center;justify-content:center;gap:8px;padding-right:14px}
/* göstergelerin arkasında soluk araç silueti (ek dosya yok — renk sprite'ından) */
#v5::before{content:'';position:absolute;inset:0;z-index:0;opacity:.16;
  background:url(colors.png) -1560px 0/2080px 250px no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 46%,#000 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 46%,#000 100%)}
.g{position:relative;z-index:2;width:112px;height:96px;text-align:center}
.g svg{width:112px;height:66px;display:block}
.g .n{position:absolute;left:0;right:0;top:24px;font-size:21px;font-weight:800;letter-spacing:-.8px;color:var(--ford-lacivert,#00095B)}
.g .n small{font-size:9.5px;font-weight:700;margin-left:2px;letter-spacing:0}
.g .lb{font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#5B6B80;margin-top:2px}
.g .bgArc{fill:none;stroke:rgba(16,24,32,.13);stroke-width:6;stroke-linecap:round}
.g .val{fill:none;stroke:var(--ford-mavi,#066FEF);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:207 276;stroke-dashoffset:207;transition:stroke-dashoffset 1.5s cubic-bezier(.2,.7,.2,1)}

.ad{position:absolute;left:200px;bottom:0;z-index:15;font-size:7px;font-weight:600;letter-spacing:1.1px;
  color:rgba(16,24,32,.28);padding:4px 8px;pointer-events:none}
</style></head><body>

.47-1.46-.42-4.09.24-10.48.86-14.81,1.4-1,.13-1.2.33-1.42.69-6.9,11.38-14.26,23.65-22.35,31.86C104.65,97.38,97.44,99.7,89.79,99.75ZM155.54,49.2c.1.58.33.7.6.65a6.37,6.37,0,0,0,3.6-2.6c.78-1.14,1.14-2.78.37-3.43a2,2,0,0,0-2.63.31,5.81,5.81,0,0,0-1.94,5.07h0"/></g></svg>

    <!-- 2 · MENZİL & ŞARJ -->
    <section class="pan" id="p2">
      <div class="vp" id="v2">
        <div id="car2"></div>
        <div class="road"><i id="prog"></i></div>

      </div>
      <div class="cap"><div class="k" id="k2"></div><h1 id="h2x"></h1>
        <div class="big"><span id="KM">60</span><small>km</small></div>
        <div class="chg"><b id="MIN">0</b><span>dakika şarj</span></div></div>
      <div class="hint" id="H2"></div>
    </section>

    <!-- 3 · TEKNOLOJİ -->
    <section class="pan" id="p3">
      <div class="vp" id="v3"></div>
      <div class="cap"><div class="k" id="k3"></div><h1 id="h3x"></h1>
        <div class="ht" id="HT"></div><div class="hd" id="HD"></div></div>
      <div class="hint" id="H3"></div>
    </section>

    <!-- 4 · RÖNTGEN -->
    <section class="pan" id="p4">
      <div class="vp" id="v4"><div id="x4b"></div><div id="x4a"></div>
        <div class="ln"></div><div class="gr">⇄</div>
        <div class="tg"><span id="tgA">Röntgen</span><span id="tgB">Dış görünüm</span></div></div>
      <div class="cap"><div class="k" id="k4"></div><h1 id="h4x"></h1><div class="d" id="d4"></div></div>
      <div class="hint" id="H4"></div>
    </section>

    <!-- 5 · PERFORMANS -->
    <section class="pan" id="p5">
      <div class="vp" id="v5"></div>
      <div class="cap"><div class="k" id="k5"></div><h1 id="h5x"></h1><div class="d" id="d5"></div></div>
    </section>

  </main>
  <div class="ad">REKLAM</div>
</div>

<script>
/* ==========================================================================
   FORD EXPLORER · 970x250 DİNAMİK KREATİF (MASTER)
   Soldaki 6 butonun her biri ayrı bir interaktif kreatifi açar.
   --------------------------------------------------------------------------
   AYARLAR — değiştirmek için SADECE aşağıdaki CONFIG bloğunu düzenleyin.
   ========================================================================== */
var CONFIG = {

  /* --- Tıklama adresi (ad server clickTag'i otomatik geçersiz kılabilir) --- */
  clickTag: "https://www.ford.com.tr/ford-store-araclar/elektrikli-explorer",

  /* --- Marka renkleri --- */
  renkLacivert: "#00095B",
  renkMavi:     "#066FEF",

  /* --- Genel --- */
  butonMetni:      "Keşfet ›",
  baslikHtml:      "Yeni Ford<br><b>Explorer®</b>",
  otoGecisSuresi:  6000,   // sekmeler kaç ms'de bir otomatik ilerlesin
  otoGecisAcik:    true,   // kullanıcı bir sekmeye basınca otomatik geçiş durur

  /* --- Sekmeler: sıra + menü etiketi + metinler --- */
  sekmeler: [
    { menu:"360° Görünüm",  kicker:"360° Görünüm",  metin:"Aracı sürükleyerek her açıdan inceleyin.",           ipucu:"↔ Sürükleyin" },
    { menu:"Renk Seçimi",   kicker:"Renk Seçimi",   metin:"Türkiye'de sunulan 4 gövde rengini karşılaştırın.",  ipucu:"Mouse'u araç üzerinde gezdirin" },
    { menu:"Menzil & Şarj", kicker:"Menzil & Şarj", metin:"",                                                   ipucu:"↔ Sürükleyin" },
    { menu:"Teknoloji",     kicker:"Teknoloji",     metin:"",                                                   ipucu:"Noktalara tıklayın" },
    { menu:"Röntgen",       kicker:"Röntgen",       metin:"Çizgiyi sürükleyin: gövde şeffaflaşsın, 77 kWh batarya ve şasi ortaya çıksın.", ipucu:"↔ Sürükleyin" },
    { menu:"Performans",    kicker:"Performans",    metin:"WLTP kombine döngü değerleri.",                      ipucu:"" }
  ],

  /* --- Sekme 1: renkler (sprite sırası ile aynı olmalı) --- */
  renkAdlari: ["Buz Beyazı","Manyetik Gri","Akik Siyahı","Kutup Mavisi"],
  renkNoktalari: ["#F2F4F6","#4A4D53","#141416","#8AA6BE"],   // menüdeki yuvarlaklar
  renkZemin: [[228,235,242],[225,227,231],[222,224,228],[219,231,241]], // sahne arka plan tonu
  renkOtoAralik: 2600,

  /* --- Sekme 2: menzil --- */
  maksMenzil: 602,      // km (WLTP)
  maksSarjDk: 25,       // %10 → %80 hızlı şarj süresi
  // yol üzerindeki kilometre taşları: km = yanacağı değer, x = yoldaki konum (%)
  kmTaslari: [
    { km:155, x:39, ad:"BURSA · 155 KM" },
    { km:450, x:70, ad:"ANKARA · 450 KM" },
    { km:590, x:96, ad:"" }
  ],

  /* --- Sekme 3: teknoloji hotspot'ları (x/y = viewport içi yüzde) --- */
  hotspotlar: [
    { x:83, y:42, baslik:"Matrix LED farlar",  metin:"Karşı şeridi karartıp yolu aydınlatmaya devam eder." },
    { x:72, y:46, baslik:"185 kW hızlı şarj",  metin:"%10'dan %80'e yaklaşık 25 dakikada." },
    { x:48, y:68, baslik:"77 kWh batarya",     metin:"Zemine gömülü paket; alçak ağırlık merkezi, geniş iç hacim." }
  ],
  hotspotOtoGecis: 3000,

  /* --- Sekme 4: röntgen --- */
  rontgenEtiketSol: "Röntgen · 77 kWh batarya",
  rontgenEtiketSag: "Dış görünüm",
  supurmeHizi: 2600,

  /* --- Sekme 5: göstergeler --- */
  gostergeler: [
    { deger:602, birim:"km",  etiket:"WLTP Menzil", dolu:.86, ondalik:0 },
    { deger:25,  birim:"dk",  etiket:"%10→80 Şarj", dolu:.62, ondalik:0 },
    { deger:340, birim:"BG",  etiket:"Güç",         dolu:.74, ondalik:0 },
    { deger:5.3, birim:"sn",  etiket:"0–100 km/s",  dolu:.68, ondalik:1 }
  ],
  gostergeTekrar: 7200
};

/* ========================= CONFIG UYGULANIYOR ========================= */
var clickTag = CONFIG.clickTag;
var R = document.documentElement.style;
R.setProperty("--ford-lacivert", CONFIG.renkLacivert);
R.setProperty("--ford-mavi", CONFIG.renkMavi);

var $ = function(id){ return document.getElementById(id) };
var NT = CONFIG.sekmeler.length;

$('C').textContent = CONFIG.butonMetni;
for (var i = 0; i < NT; i++) {
  var s = CONFIG.sekmeler[i];
  $('k' + i).textContent = s.kicker;
  var h = $(i === 0 ? 'h0' : 'h' + i + 'x'); if (h) h.innerHTML = CONFIG.baslikHtml;
  var d = $('d' + i); if (d) d.textContent = s.metin;
  var hi = $('H' + i); if (hi) hi.textContent = s.ipucu;
}

/* ============================ SEKME MOTORU ============================ */
var NAV = $('NAV'), btns = [], act = 0, oto = CONFIG.otoGecisAcik, tabT0 = performance.now();

for (var i = 0; i < NT; i++) {
  var b = document.createElement('button');
  b.innerHTML = CONFIG.sekmeler[i].menu + '<em>›</em><i></i>';
  b.setAttribute('data-t', i);
  b.addEventListener('click', (function (n) {
    return function (e) { e.stopPropagation(); oto = false; show(n); };
  })(i));
  NAV.appendChild(b); btns.push(b);
}

function show(n) {
  if (n === act) { tabT0 = performance.now(); return }
  $('p' + act).className = 'pan';
  btns[act].className = ''; btns[act].style.setProperty('--pr', '0%');
  act = n; tabT0 = performance.now();
  $('p' + n).className = 'pan on';
  btns[n].className = 'on';
  if (ENTER[n]) ENTER[n]();
}

/* ==================== SEKME 0 · 360° SÜRÜKLE-DÖNDÜR ==================== */
var NF = 6, w0 = $('w0'), v0 = $('v0'), D0 = $('D0');
for (var i = 0; i < NF; i++) D0.appendChild(document.createElement('s'));
var d0s = D0.children, ang = 0, snap = null, dg0 = 0, sx0 = 0, sa0 = 0, hold0 = 0;

function draw0() {
  var n = ((ang % NF) + NF) % NF, f = Math.floor(n), fr = n - f;
  var k = Math.min(1, Math.max(0, (fr - .72) / .28)); k = k * k * (3 - 2 * k);
  var p = Math.round(f + k) % NF;
  w0.style.transform = 'translateX(' + (-p * (100 / NF)) + '%)';
  for (var j = 0; j < NF; j++) d0s[j].className = (j === p) ? 'on' : '';
}
function step0(dt, ts) {
  if (dg0) return draw0();
  if (snap !== null) {
    ang += (snap - ang) * Math.min(1, dt * .009);
    if (Math.abs(snap - ang) < .004) { ang = snap; snap = null }
  } else if (ts > hold0) ang += dt * .0013;
  draw0();
}
function gx(e) { return e.touches ? e.touches[0].clientX : e.clientX }
v0.addEventListener('mousedown', function (e) { dg0 = 1; sx0 = gx(e); sa0 = ang; snap = null; $('H0').className = 'hint h'; e.preventDefault() });
v0.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { dg0 = 1; sx0 = gx(e); sa0 = ang; snap = null; $('H0').className = 'hint h' } }, { passive: true });
v0.addEventListener('touchmove', function (e) { if (dg0) { ang = sa0 + (gx(e) - sx0) / 52; e.preventDefault() } }, { passive: false });
v0.addEventListener('touchend', function () { if (dg0) { dg0 = 0; snap = Math.round(ang); hold0 = performance.now() + 1800 } });
window.addEventListener('mousemove', function (e) { if (dg0) ang = sa0 + (gx(e) - sx0) / 52 });
window.addEventListener('mouseup', function () { if (dg0) { dg0 = 0; snap = Math.round(ang); hold0 = performance.now() + 1800 } });

/* ======================= SEKME 1 · RENK SEÇİMİ ======================= */
var NC = CONFIG.renkAdlari.length, c1a = $('c1a'), c1b = $('c1b'), v1 = $('v1'),
    NM = $('NM'), SW = $('SW'), pbg1 = $('pbg1');
for (var i = 0; i < NC; i++) {
  var s = document.createElement('b');
  s.style.background = CONFIG.renkNoktalari[i];
  s.setAttribute('data-c', i);
  s.addEventListener('click', (function (n) {
    return function (e) { e.stopPropagation(); u1 = 1; t1 = n; $('H1').className = 'hint h' };
  })(i));
  SW.appendChild(s);
}
var sws = SW.children, cc1 = 0, t1 = 0, u1 = 0, tc0 = performance.now();
function step1(dt, ts) {
  if (!u1) t1 = Math.floor((ts - tc0) / CONFIG.renkOtoAralik) % NC;
  cc1 += (t1 - cc1) * Math.min(1, dt * .009);
  if (Math.abs(t1 - cc1) < .002) cc1 = t1;
  var f = Math.floor(cc1), nx = Math.min(NC - 1, f + 1), fr = cc1 - f;
  var P = function (k) { return (k * (100 / (NC - 1))) + '% 0' };
  c1a.style.backgroundPosition = P(f);
  c1b.style.backgroundPosition = P(nx);
  c1b.style.opacity = fr;
  var a = CONFIG.renkZemin[f], b = CONFIG.renkZemin[nx], m = function (k) { return Math.round(a[k] + (b[k] - a[k]) * fr) };
  var lo = 'rgb(' + Math.max(0, m(0) - 22) + ',' + Math.max(0, m(1) - 17) + ',' + Math.max(0, m(2) - 10) + ')';
  pbg1.style.background =
    'radial-gradient(78% 118% at 66% 44%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 72%),' +
    'linear-gradient(90deg,rgb(' + m(0) + ',' + m(1) + ',' + m(2) + ') 0%,' + lo + ' 32.5%,' + lo + ' 100%)';
  var sel = Math.round(cc1);
  NM.textContent = CONFIG.renkAdlari[sel];
  for (var j = 0; j < NC; j++) sws[j].className = (j === sel) ? 'on' : '';
}
function fromX(el, x) { var r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)) }
v1.addEventListener('mousemove', function (e) { u1 = 1; t1 = fromX(v1, e.clientX) * (NC - 1); $('H1').className = 'hint h' });
v1.addEventListener('touchmove', function (e) { if (e.touches.length === 1) { u1 = 1; t1 = fromX(v1, e.touches[0].clientX) * (NC - 1); $('H1').className = 'hint h'; e.preventDefault() } }, { passive: false });

/* ====================== SEKME 2 · MENZİL & ŞARJ ====================== */
var v2 = $('v2'), car2 = $('car2'), prog = $('prog'), KM = $('KM'), MIN = $('MIN'),
    bfill = $('bfill'), bpc = $('bpc'), pns = [];
CONFIG.kmTaslari.forEach(function (o) {
  var p = document.createElement('div');
  p.className = 'pin'; p.style.left = o.x + '%';
  p.innerHTML = '<span>' + o.ad + '</span>';
  v2.appendChild(p); pns.push(p);
});
var cur2 = .10, tg2 = .10, dg2 = 0, u2 = 0, tm0 = performance.now();
function step2(dt, ts) {
  if (!u2) { var t = (ts - tm0) / 3400; tg2 = .10 + .70 * (.5 + .5 * Math.sin(t * Math.PI - Math.PI / 2)) }
  cur2 += (tg2 - cur2) * Math.min(1, dt * .011);
  if (Math.abs(tg2 - cur2) < .001) cur2 = tg2;
  var km = Math.round(CONFIG.maksMenzil * cur2), p = (cur2 - .10) / .70;
  KM.textContent = km;
  // hizli sarj penceresi %10 -> %80 ile sinirli; ustune cikildiginda sure artmaz
  MIN.textContent = Math.round(Math.min(1, Math.max(0, p)) * CONFIG.maksSarjDk);
  bpc.textContent = '%' + Math.round(cur2 * 100);
  bfill.style.width = (cur2 * 100) + '%';
  prog.style.width = (cur2 * 100) + '%';
  car2.style.transform = 'translateX(' + ((cur2 - .10) * 46) + 'px)';
  for (var j = 0; j < pns.length; j++) pns[j].className = km >= CONFIG.kmTaslari[j].km ? 'pin on' : 'pin';
}
function set2(x) { tg2 = Math.min(.98, Math.max(.05, fromX(v2, x))); u2 = 1; $('H2').className = 'hint h' }
v2.addEventListener('mousedown', function (e) { dg2 = 1; set2(e.clientX); e.preventDefault() });
v2.addEventListener('mousemove', function (e) { if (u2 || dg2) set2(e.clientX) });
window.addEventListener('mousemove', function (e) { if (dg2) set2(e.clientX) });
window.addEventListener('mouseup', function () { dg2 = 0 });
v2.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { dg2 = 1; set2(e.touches[0].clientX) } }, { passive: true });
v2.addEventListener('touchmove', function (e) { if (dg2) { set2(e.touches[0].clientX); e.preventDefault() } }, { passive: false });
v2.addEventListener('touchend', function () { dg2 = 0 });

/* ======================== SEKME 3 · TEKNOLOJİ ======================== */
var v3 = $('v3'), HT = $('HT'), HD = $('HD'), hbs = [], h3 = 0, u3 = 0, th0 = performance.now();
CONFIG.hotspotlar.forEach(function (o, i) {
  var b = document.createElement('button');
  b.className = 'hs'; b.style.left = o.x + '%'; b.style.top = o.y + '%';
  b.innerHTML = '<u>' + (i + 1) + '</u>';
  b.addEventListener('click', function (e) { e.stopPropagation(); u3 = 1; setHS(i); $('H3').className = 'hint h' });
  b.addEventListener('mouseenter', function () { u3 = 1; setHS(i); $('H3').className = 'hint h' });
  v3.appendChild(b); hbs.push(b);
});
function setHS(i) {
  h3 = i; HT.textContent = CONFIG.hotspotlar[i].baslik; HD.textContent = CONFIG.hotspotlar[i].metin;
  for (var j = 0; j < hbs.length; j++) hbs[j].className = (j === i) ? 'hs on' : 'hs';
}
setHS(0);
function step3(dt, ts) {
  if (!u3 && ts - th0 > CONFIG.hotspotOtoGecis) { th0 = ts; setHS((h3 + 1) % hbs.length) }
}

/* ========================= SEKME 4 · RÖNTGEN ========================= */
var v4 = $('v4'), dg4 = 0, u4 = 0, tx0 = performance.now();
$('tgA').textContent = CONFIG.rontgenEtiketSol;
$('tgB').textContent = CONFIG.rontgenEtiketSag;
function set4(p) { v4.style.setProperty('--c', Math.min(96, Math.max(4, p)) + '%') }
function step4(dt, ts) { if (!u4) set4(50 + 44 * Math.sin(((ts - tx0) / CONFIG.supurmeHizi) * Math.PI)) }
function from4(x) { u4 = 1; set4(fromX(v4, x) * 100); $('H4').className = 'hint h' }
v4.addEventListener('mousedown', function (e) { dg4 = 1; from4(e.clientX); e.preventDefault() });
v4.addEventListener('mouseenter', function () { u4 = 1 });
v4.addEventListener('mousemove', function (e) { if (dg4 || u4) from4(e.clientX) });
window.addEventListener('mousemove', function (e) { if (dg4) from4(e.clientX) });
window.addEventListener('mouseup', function () { dg4 = 0 });
v4.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { dg4 = 1; from4(e.touches[0].clientX) } }, { passive: true });
v4.addEventListener('touchmove', function (e) { if (dg4) { from4(e.touches[0].clientX); e.preventDefault() } }, { passive: false });
v4.addEventListener('touchend', function () { dg4 = 0 });

/* ======================= SEKME 5 · PERFORMANS ======================= */
var v5 = $('v5'), gEls = [];
CONFIG.gostergeler.forEach(function (o) {
  var g = document.createElement('div'); g.className = 'g';
  g.innerHTML =
    '<svg viewBox="0 0 112 66"><path class="bgArc" d="M12 60 A44 44 0 1 1 100 60"/>' +
    '<path class="val" d="M12 60 A44 44 0 1 1 100 60"/></svg>' +
    '<div class="n">0<small>' + o.birim + '</small></div><div class="lb">' + o.etiket + '</div>';
  v5.appendChild(g); gEls.push(g);
});
function runGauges() {
  gEls.forEach(function (g, i) {
    var o = CONFIG.gostergeler[i], val = g.querySelector('.val'), n = g.querySelector('.n');
    val.style.strokeDashoffset = 207;
    n.innerHTML = (0).toFixed(o.ondalik) + '<small>' + o.birim + '</small>';
    setTimeout(function () {
      val.style.strokeDashoffset = 207 * (1 - o.dolu);
      var t0 = performance.now();
      (function tick() {
        var k = Math.min(1, (performance.now() - t0) / 1500); k = 1 - Math.pow(1 - k, 3);
        n.innerHTML = (o.deger * k).toFixed(o.ondalik) + '<small>' + o.birim + '</small>';
        if (k < 1) setTimeout(tick, 32);
      })();
    }, 140 + i * 160);
  });
}
var tg0 = 0;
function step5(dt, ts) { if (ts - tg0 > CONFIG.gostergeTekrar) { tg0 = ts; runGauges() } }

/* ===================== ANA DÖNGÜ + OTOMATİK GEÇİŞ ===================== */
var STEP = [step0, step1, step2, step3, step4, step5];
var ENTER = { 5: function () { tg0 = 0 }, 3: function () { th0 = performance.now() } };
var last = 0;
function loop(ts) {
  if (!last) last = ts;
  var dt = Math.min(50, ts - last); last = ts;
  STEP[act](dt, ts);
  if (oto) {
    var pr = (ts - tabT0) / CONFIG.otoGecisSuresi;
    btns[act].style.setProperty('--pr', Math.min(100, pr * 100) + '%');
    if (pr >= 1) show((act + 1) % NT);
  }
  requestAnimationFrame(loop);
}
btns[0].className = 'on';
requestAnimationFrame(loop);

/* ============================== CLICKTAG ============================== */
function go() { window.open(clickTag, '_blank') }
var dx0 = 0, dy0 = 0;
$('B').addEventListener('mousedown', function (e) { dx0 = e.clientX; dy0 = e.clientY });
$('B').addEventListener('click', function (e) {
  if (Math.abs(e.clientX - dx0) + Math.abs(e.clientY - dy0) > 6) return;  // sürükleme tıklama sayılmaz
  go();
});
$('C').addEventListener('click', function (e) { e.stopPropagation(); go() });
</script></body></html>
